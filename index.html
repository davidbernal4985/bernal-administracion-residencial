<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08152a"><title>BERNAL | Administración Residencial</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#08152a;--navy2:#102542;--gold:#c9a451;--bg:#f4f6fa;--ink:#172338;--muted:#66748a;--line:#e1e6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit;max-width:100%}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--navy);color:#fff;font-weight:650;min-height:42px}.alt{background:#eef1f6;color:var(--ink);border:1px solid var(--line)}header{background:var(--navy);color:white;border-bottom:3px solid var(--gold);padding:12px 18px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:1px solid var(--gold);border-radius:9px;display:grid;place-items:center;color:#f2d58b;font: bold 20px Georgia}.brand strong{display:block;color:#f2d58b;letter-spacing:2px;font-size:20px}.brand small{font-size:10px;letter-spacing:1px}.shell{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px}aside{background:var(--navy);border-radius:13px;padding:9px;height:max-content;position:sticky;top:12px}.nav{display:flex;width:100%;text-align:left;align-items:center;gap:10px;margin:3px 0;background:transparent;color:#e9edf5;font-weight:550}.nav.active{background:var(--navy2);box-shadow:inset 3px 0 var(--gold)}.ico{width:22px;text-align:center;font-size:19px;color:var(--gold)}main{min-width:0}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:13px}h1{font-size:24px;margin:0 0 5px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-weight:650;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd7e4;border-radius:8px;min-height:42px;background:white;color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow-x:auto;max-width:100%}table{width:100%;min-width:540px;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;word-break:normal;overflow-wrap:normal}th{font-size:12px;color:var(--muted)}.services{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.service{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;align-items:center;gap:9px}.bubble{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:23px;flex:0 0 38px}.water{background:#e5f2ff;color:#168bff}.power{background:#fff3cc;color:#d99a00}.gas{background:#ffe8e1;color:#e85d35}.other{background:#e8e7ff;color:#7065d8}.notice{padding:11px;border-radius:9px;background:#eef5ff;margin:10px 0}.error{background:#fff0f0;color:#922b37}.ok{background:#eaf8ef;color:#17663b}.hidden{display:none!important}.config{border:1px solid var(--line);border-radius:10px;padding:13px;margin:10px 0}.radio{display:flex;gap:12px;flex-wrap:wrap}.radio label{display:flex;align-items:center;gap:6px}.radio input{width:auto;min-height:0}#auth{max-width:550px;margin:35px auto;padding:18px}@media(max-width:820px){.shell{grid-template-columns:1fr;padding:10px}aside{position:static;display:flex;overflow-x:auto}.nav{width:auto;white-space:nowrap;flex:0 0 auto}.services{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){header{padding:10px}.brand strong{font-size:17px}.brand small{font-size:9px}.shell{padding:8px;gap:9px}.card{padding:12px}.grid{grid-template-columns:1fr}.service{padding:8px;gap:6px}.bubble{width:32px;height:32px;flex-basis:32px}h1{font-size:21px}}
</style></head><body>
<header><div class="logo">B</div><div class="brand"><strong>BERNAL</strong><small>ADMINISTRACIÓN RESIDENCIAL</small></div><div class="grow"></div><span id="userLabel" class="small"></span></header>
<section id="auth" class="card"><h1>Acceso a la plataforma</h1><p class="muted">Las cuentas nuevas requieren aprobación del administrador.</p><div class="grid"><div class="field"><label>Correo</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="actions"><button id="login">Iniciar sesión</button><button id="signup" class="alt">Crear cuenta</button><button id="reset" class="alt">Restablecer contraseña</button></div><div id="authMsg" class="notice hidden"></div></section>
<div id="app" class="shell hidden"><aside><button class="nav active" data-view="properties"><span class="ico">⌂</span>Propiedades</button><button class="nav" data-view="apartments"><span class="ico">▦</span>Apartamentos</button><button class="nav" data-view="services"><span class="ico">◉</span>Servicios y medidores</button><button class="nav" data-view="bills"><span class="ico">▤</span>Facturas y lecturas</button><button class="nav" data-view="receipts"><span class="ico">▣</span>Recibos y pagos</button><button class="nav" data-view="settings"><span class="ico">⚙</span>Configuración</button><button id="logout" class="nav"><span class="ico">↪</span>Cerrar sesión</button></aside><main><div class="card"><div class="row"><div class="grow"><h1 id="title">Propiedades</h1><div class="muted small">Los datos guardados se reutilizan en los siguientes periodos.</div></div><select id="propertySelect" style="max-width:300px"><option value="">Selecciona propiedad</option></select></div><div id="msg" class="notice hidden"></div></div><div id="view"></div></main></div>
<script>
(()=>{const URL='https://alcplidjbnjuppoezhir.supabase.co',KEY='sb_publishable_D0B-fyB7x_ugOyQjTx8xjg_s95YUi4L';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n||0));const S={agua:{label:'Agua',unit:'m³',icon:'💧',cls:'water'},electricidad:{label:'Electricidad',unit:'kWh',icon:'⚡',cls:'power'},gas:{label:'Gas',unit:'m³',icon:'🔥',cls:'gas'},otros:{label:'Otros servicios',unit:'unidad',icon:'🔌',cls:'other'}};let db,user,profile,view='properties',props=[],aps=[],bills=[],reads=[],receipts=[],configs=[],editId=null;
if(!window.supabase){$('authMsg').textContent='No se cargó Supabase.';$('authMsg').classList.remove('hidden');return}db=window.supabase.createClient(URL,KEY);
function message(t,k=''){const e=$('msg');e.textContent=t;e.className='notice '+k}function authmessage(t,k=''){const e=$('authMsg');e.textContent=t;e.className='notice '+k}const pid=()=>$('propertySelect').value,prop=()=>props.find(p=>String(p.id)===String(pid()));
async function load(){const rs=await Promise.all([db.from('properties').select('*').order('created_at'),db.from('apartments').select('*').order('name'),db.from('utility_bills').select('*').order('created_at',{ascending:false}),db.from('meter_readings').select('*').order('created_at',{ascending:false}),db.from('receipts').select('*').order('created_at',{ascending:false}),db.from('utility_configs').select('*')]);const names=['propiedades','apartamentos','facturas','lecturas','recibos','configuración de servicios'];rs.forEach((r,i)=>{if(r.error)throw Error('Error al cargar '+names[i]+': '+r.error.message)});[props,aps,bills,reads,receipts,configs]=rs.map(r=>r.data||[]);const old=pid();$('propertySelect').innerHTML='<option value="">Selecciona propiedad</option>'+props.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');if(props.some(p=>String(p.id)===old))$('propertySelect').value=old;else if(props.length)$('propertySelect').value=props[0].id}
async function start(){if(!user)return;try{const r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;profile=r.data;if(!profile||profile.approved!==true){$('app').classList.add('hidden');$('auth').classList.remove('hidden');authmessage('Tu cuenta está pendiente de aprobación por el administrador.');return}await load();$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=user.email;render()}catch(e){authmessage(e.message,'error')}}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${esc(label)}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function serviceOpts(v='agua'){return Object.keys(S).map(k=>`<option value="${k}" ${v===k?'selected':''}>${S[k].icon} ${S[k].label}</option>`).join('')}function aptOpts(){return '<option value="">Selecciona apartamento</option>'+aps.filter(a=>String(a.property_id)===String(pid())).map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}
function render(){const p=prop(),titles={properties:'Propiedades',apartments:'Apartamentos',services:'Servicios y medidores',bills:'Facturas y lecturas',receipts:'Recibos y pagos',settings:'Configuración'};$('title').textContent=titles[view];let h='';
if(view==='properties')h=`<div class="card"><h2>${editId?'Editar propiedad':'Registrar propiedad'}</h2><form id="pf" class="grid">${field('Nombre','name','text',props.find(x=>String(x.id)===String(editId))?.name||'','required')}${field('Dirección','address','text',props.find(x=>String(x.id)===String(editId))?.address||'')}<div class="actions"><button>${editId?'Guardar cambios':'Guardar propiedad'}</button>${editId?'<button type="button" class="alt" id="cancel">Cancelar</button>':''}</div></form></div><div class="card"><h2>Propiedades guardadas</h2><div class="tablewrap"><table><tr><th>Propiedad</th><th>Dirección</th><th>Apartamentos</th><th>Acciones</th></tr>${props.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.address||'—')}</td><td>${aps.filter(a=>String(a.property_id)===String(x.id)).length}</td><td><button class="alt" data-edit="${x.id}">Editar</button> <button class="alt" data-pick="${x.id}">Seleccionar</button></td></tr>`).join('')||'<tr><td colspan="4">Sin propiedades registradas.</td></tr>'}</table></div><p class="small muted">No se ofrece eliminación automática para proteger datos relacionados.</p></div>`;
if(view==='apartments')h=!p?'<div class="card">Crea y selecciona una propiedad primero.</div>':`<div class="card"><h2>Apartamento · ${esc(p.name)}</h2><form id="af" class="grid">${field('Número o nombre','name','text','','required')}${field('Responsable','responsible_name')}${field('Ocupantes','occupants','number','1','min="1" required')}${field('Medidor de agua','water_meter_number')}${field('Medidor electricidad','electricity_meter_number')}${field('Medidor gas','gas_meter_number')}<div class="actions"><button>Guardar apartamento</button></div></form></div><div class="card"><h2>Apartamentos guardados</h2><div class="tablewrap"><table><tr><th>Apartamento</th><th>Responsable</th><th>Ocupantes</th><th>Agua</th><th>Electricidad</th><th>Gas</th></tr>${aps.filter(a=>String(a.property_id)===String(p.id)).map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.responsible_name||'—')}</td><td>${esc(a.occupants||0)}</td><td>${esc(a.water_meter_number||'—')}</td><td>${esc(a.electricity_meter_number||'—')}</td><td>${esc(a.gas_meter_number||'—')}</td></tr>`).join('')||'<tr><td colspan="6">Sin apartamentos.</td></tr>'}</table></div></div>`;
if(view==='services')h=!p?'<div class="card">Selecciona una propiedad.</div>':`<div class="card"><h2>Servicios de ${esc(p.name)}</h2><div class="services">${Object.entries(S).map(([k,s])=>`<div class="service"><span class="bubble ${s.cls}">${s.icon}</span><div><b>${s.label}</b><br><span class="small muted">${s.unit}</span></div></div>`).join('')}</div>${Object.entries(S).map(([k,s])=>{const c=configs.find(x=>String(x.property_id)===String(p.id)&&x.service===k);return `<div class="config"><div class="row"><b class="grow">${s.icon} ${s.label}</b><span class="small muted">${s.unit}</span></div><div class="radio"><label><input type="radio" name="m-${k}" value="submeters" ${!c||c.allocation_method==='submeters'?'checked':''}> Medidor por apartamento</label><label><input type="radio" name="m-${k}" value="occupants" ${c?.allocation_method==='occupants'?'checked':''}> Repartir por ocupantes</label></div><div class="grid">${field('Unidad','u-'+k,'text',c?.billing_unit||s.unit)}${field('Nombre personalizado','l-'+k,'text',c?.custom_label||'')}</div><div class="actions"><button data-config="${k}">Guardar configuración</button></div></div>`}).join('')}</div><div class="card"><h2>Lecturas guardadas</h2><div class="tablewrap"><table><tr><th>Apartamento</th><th>Servicio</th><th>Periodo</th><th>Anterior</th><th>Actual</th><th>Consumo</th></tr>${reads.filter(r=>aps.some(a=>String(a.id)===String(r.apartment_id)&&String(a.property_id)===String(p.id))).map(r=>`<tr><td>${esc(aps.find(a=>String(a.id)===String(r.apartment_id))?.name||'')}</td><td>${esc(S[r.service]?.label||r.service)}</td><td>${esc(r.billing_period||'')}</td><td>${esc(r.previous_reading)}</td><td>${esc(r.current_reading)}</td><td>${Number(r.current_reading||0)-Number(r.previous_reading||0)}</td></tr>`).join('')||'<tr><td colspan="6">Sin lecturas guardadas.</td></tr>'}</table></div></div>`;
if(view==='bills')h=!p?'<div class="card">Selecciona una propiedad.</div>':`<div class="card"><h2>Registrar factura manualmente</h2><form id="bf" class="grid"><div class="field"><label>Servicio</label><select name="service">${serviceOpts()}</select></div>${field('Empresa','provider')}${field('Periodo','billing_period','month',new Date().toISOString().slice(0,7),'required')}${field('Total COP','amount','number','','min="0" required')}${field('Consumo total','consumption_total','number','','min="0" step="any"')}${field('Unidad','billing_unit','text','m³')}${field('Lectura general anterior','general_previous_reading','number','','min="0" step="any"')}${field('Lectura general actual','general_current_reading','number','','min="0" step="any"')}${field('Emisión','issue_date','date')}${field('Vencimiento','due_date','date')}<div class="actions"><button>Guardar factura</button></div></form><p class="small muted">La carga y lectura OCR de fotos/PDF requiere desplegar la función Edge incluida y conectar el resultado a este formulario.</p></div><div class="card"><h2>Historial de facturas</h2><div class="tablewrap"><table><tr><th>Periodo</th><th>Servicio</th><th>Empresa</th><th>Consumo</th><th>Total</th></tr>${bills.filter(b=>String(b.property_id)===String(p.id)).map(b=>`<tr><td>${esc(b.billing_period)}</td><td>${esc(S[b.service]?.label||b.service)}</td><td>${esc(b.provider||'—')}</td><td>${esc(b.consumption_total??'—')} ${esc(b.billing_unit||'')}</td><td>${money(b.amount)}</td></tr>`).join('')||'<tr><td colspan="5">Sin facturas.</td></tr>'}</table></div></div><div class="card"><h2>Registrar lectura de apartamento</h2><form id="rf" class="grid"><div class="field"><label>Apartamento</label><select name="apartment_id" required>${aptOpts()}</select></div><div class="field"><label>Servicio</label><select name="service">${serviceOpts()}</select></div>${field('Periodo','billing_period','month',new Date().toISOString().slice(0,7),'required')}${field('Lectura anterior','previous_reading','number','','min="0" step="any" required')}${field('Lectura actual','current_reading','number','','min="0" step="any" required')}<div class="actions"><button>Guardar lectura</button></div></form></div>`;
if(view==='receipts')h=!p?'<div class="card">Selecciona una propiedad.</div>':`<div class="card"><h2>Crear recibo</h2><form id="cf" class="grid"><div class="field"><label>Apartamento</label><select name="apartment_id" required>${aptOpts()}</select></div>${field('Número de recibo','receipt_number')}${field('Periodo','billing_period','month',new Date().toISOString().slice(0,7),'required')}${field('Concepto','concept','text','Servicios públicos','required')}${field('Valor COP','amount','number','','min="0" required')}<div class="field"><label>Estado</label><select name="status"><option value="draft">Pendiente</option><option value="sent">Enviado</option><option value="paid">Pagado</option></select></div><div class="actions"><button>Guardar recibo</button></div></form></div><div class="card"><h2>Recibos guardados</h2><div class="tablewrap"><table><tr><th>Número</th><th>Apartamento</th><th>Periodo</th><th>Concepto</th><th>Valor</th><th>Estado</th><th></th></tr>${receipts.filter(r=>aps.some(a=>String(a.id)===String(r.apartment_id)&&String(a.property_id)===String(p.id))).map(r=>`<tr><td>${esc(r.receipt_number||'—')}</td><td>${esc(aps.find(a=>String(a.id)===String(r.apartment_id))?.name||'')}</td><td>${esc(r.billing_period)}</td><td>${esc(r.concept)}</td><td>${money(r.amount)}</td><td>${esc(r.status)}</td><td><button class="alt" data-wa="${r.id}">WhatsApp</button></td></tr>`).join('')||'<tr><td colspan="7">Sin recibos.</td></tr>'}</table></div><p class="small muted">El botón comparte el detalle por WhatsApp. PNG y cálculo automático requieren integración adicional.</p></div>`;
if(view==='settings')h=`<div class="card"><h2>Cuenta y seguridad</h2><p>${esc(user?.email)} · Rol: ${esc(profile?.role||'')} · Aprobada: ${profile?.approved?'Sí':'No'}</p><div class="notice">La clave OCR debe guardarse como secreto de Supabase; nunca en este HTML público.</div></div>`;$('view').innerHTML=h;bind()}
function fd(f){return Object.fromEntries(new FormData(f).entries())}async function save(table,data,id){const q=id?db.from(table).update(data).eq('id',id):db.from(table).insert(data);const r=await q;if(r.error)throw r.error;await load();editId=null;render();message('Datos guardados en Supabase.','ok')}
function bind(){$('cancel')?.addEventListener('click',()=>{editId=null;render()});$('pf')?.addEventListener('submit',async e=>{e.preventDefault();try{await save('properties',fd(e.target),editId)}catch(x){message('No se pudo guardar: '+x.message,'error')}});$('af')?.addEventListener('submit',async e=>{e.preventDefault();try{let o=fd(e.target);o.property_id=pid();o.occupants=Number(o.occupants);await save('apartments',o)}catch(x){message('No se pudo guardar el apartamento: '+x.message,'error')}});$('bf')?.addEventListener('submit',async e=>{e.preventDefault();try{let o=fd(e.target);o.property_id=pid();['amount','consumption_total','general_previous_reading','general_current_reading'].forEach(k=>o[k]=o[k]===''?null:Number(o[k]));o.allocation_method=configs.find(c=>String(c.property_id)===String(pid())&&c.service===o.service)?.allocation_method||'submeters';await save('utility_bills',o)}catch(x){message('Error al guardar factura. Revisa columnas/RLS: '+x.message,'error')}});$('rf')?.addEventListener('submit',async e=>{e.preventDefault();try{let o=fd(e.target);o.previous_reading=Number(o.previous_reading);o.current_reading=Number(o.current_reading);if(o.current_reading<o.previous_reading)throw Error('La lectura actual no puede ser menor que la anterior.');await save('meter_readings',o)}catch(x){message(x.message,'error')}});$('cf')?.addEventListener('submit',async e=>{e.preventDefault();try{let o=fd(e.target);o.amount=Number(o.amount);if(!o.receipt_number)o.receipt_number='BER-'+Date.now().toString().slice(-8);await save('receipts',o)}catch(x){message('Error al guardar recibo: '+x.message,'error')}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render()});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{$('propertySelect').value=b.dataset.pick;render()});document.querySelectorAll('[data-config]').forEach(b=>b.onclick=async()=>{try{let k=b.dataset.config,method=document.querySelector(`input[name="m-${k}"]:checked`)?.value||'submeters',unit=$('u-'+k).value||S[k].unit,label=$('l-'+k).value||null,old=configs.find(c=>String(c.property_id)===String(pid())&&c.service===k),o={property_id:pid(),service:k,allocation_method:method,billing_unit:unit,custom_label:label};let r=old?await db.from('utility_configs').update(o).eq('id',old.id):await db.from('utility_configs').insert(o);if(r.error)throw r.error;await load();render();message('Configuración guardada para esta propiedad y servicio.','ok')}catch(x){message('No se pudo guardar. Ejecuta la migración incluida y revisa RLS: '+x.message,'error')}});document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{let r=receipts.find(x=>String(x.id)===b.dataset.wa),a=aps.find(x=>String(x.id)===String(r?.apartment_id));if(!r)return;let t=`BERNAL | Administración Residencial\nRecibo ${r.receipt_number||''}\nApartamento: ${a?.name||''}\nPeriodo: ${r.billing_period}\n${r.concept}\nTotal: ${money(r.amount)}\nEstado: ${r.status}`;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener')})}
$('login').onclick=async()=>{try{let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;user=r.data.user;await start()}catch(e){authmessage('Error de acceso: '+e.message,'error')}};$('signup').onclick=async()=>{try{let r=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;authmessage('Cuenta creada. Confirma el correo y espera la aprobación del administrador.')}catch(e){authmessage('No se pudo crear la cuenta: '+e.message,'error')}};$('reset').onclick=async()=>{try{let r=await db.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;authmessage('Si el correo existe, recibirás instrucciones.','ok')}catch(e){authmessage(e.message,'error')}};$('logout').onclick=async()=>{await db.auth.signOut();user=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')};$('propertySelect').onchange=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)setTimeout(start,0);else{$('app').classList.add('hidden');$('auth').classList.remove('hidden')}});db.auth.getSession().then(({data})=>{user=data.session?.user||null;if(user)start()})})();
</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BERNAL | Administración Residencial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0c1830;--gold:#c7a45a;--paper:#f4f5f7;--ink:#182235;--muted:#667085;--line:#e2e5eb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px system-ui,-apple-system,sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;padding:18px 20px;border-bottom:3px solid var(--gold)}header strong{font-family:Georgia,serif;letter-spacing:2px;font-size:22px}header small{display:block;color:#e7d6ad;letter-spacing:2px}
main{max-width:1100px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px #1020400a}
h2{margin:0 0 12px;font-size:19px}h3{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select,button{width:100%;padding:11px;border:1px solid #ccd2dc;border-radius:8px;font:inherit}button{background:var(--navy);color:white;border:0;cursor:pointer;font-weight:600}button.alt{background:#e8edf4;color:var(--navy)}button.danger{background:#9f2525}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{width:auto}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{width:auto;background:#e9edf3;color:var(--navy)}.nav button.active{background:var(--navy);color:white}.muted{color:var(--muted)}.status{padding:10px;border-radius:8px;background:#f5f0e3;margin-bottom:12px;white-space:pre-wrap}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}th{background:#f7f8fa}.tablewrap{overflow:auto}.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}.item strong{display:block}.small{font-size:12px}

/* BERNAL premium identity: animated glow and metallic light sweep */
.brand-header{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:14px;
 background:radial-gradient(ellipse at 20% 0%,#19335d 0%,#0c1830 52%,#050a14 100%);
 color:#fff;padding:14px 18px;border-bottom:2px solid #c7a45a;box-shadow:0 6px 24px #050a1466}
.brand-header:after{content:"";position:absolute;inset:-80% -35%;pointer-events:none;z-index:0;
 background:linear-gradient(115deg,transparent 44%,#ffffff0b 47%,#ffe3a0b8 50%,#4aa7ff45 52%,transparent 56%);
 transform:translateX(-100%) rotate(8deg);animation:bernal-sweep 7s ease-in-out infinite}
.brand-header .brand-logo{width:74px;height:74px;object-fit:cover;border-radius:50%;border:1px solid #e9c56f;
 box-shadow:0 0 10px #d6a74355,0 0 25px #1976d233;animation:bernal-pulse 4s ease-in-out infinite}
.brand-header .brand-copy{position:relative;z-index:1}
.brand-header strong{display:block;font-family:Georgia,serif;letter-spacing:2px;font-size:24px;color:#f4d27e;text-shadow:0 0 12px #d6a74355}
.brand-header small{display:block;color:#e7d6ad;letter-spacing:1.6px;font-size:11px}
@keyframes bernal-sweep{0%,18%{transform:translateX(-100%) rotate(8deg)}70%,100%{transform:translateX(100%) rotate(8deg)}}
@keyframes bernal-pulse{0%,100%{box-shadow:0 0 8px #d6a74333,0 0 18px #1976d222}50%{box-shadow:0 0 17px #f4ce6d99,0 0 32px #1976d255}}
.receipt-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
@media(max-width:480px){.brand-header{padding:12px}.brand-header .brand-logo{width:58px;height:58px}.brand-header strong{font-size:21px}.brand-header small{font-size:9px;letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){.brand-header:after,.brand-header .brand-logo{animation:none!important}}


/* Android/iOS responsive compatibility */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, canvas, video { max-width: 100%; }
button, input, select, textarea { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { min-height: 44px; }
input, select, textarea { min-height: 44px; max-width: 100%; }
.brand-header { width: 100%; box-sizing: border-box; }
.brand-header .brand-logo { flex: 0 0 auto; }
@media (max-width: 600px) {
  body { overflow-x: hidden; }
  .container, main, .app, .layout { max-width: 100%; }
  table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .brand-header { gap: 10px; }
  .brand-header .brand-logo { width: 58px; height: 58px; }
  .brand-header strong { font-size: clamp(18px, 5vw, 24px); }
  .brand-header small { overflow-wrap: anywhere; }
}

</style>
</head>
<body>
<header class="brand-header"><img class="brand-logo" src="logo-bernal-aprobado.png" alt="Logotipo BERNAL"><div class="brand-copy"><strong>BERNAL</strong><small>ADMINISTRACIÓN RESIDENCIAL</small><small>Gestión clara · Confianza · Comunidad</small></div></header>
<main>
<div id="status" class="status">Configura la conexión y luego inicia sesión.</div>
<section id="auth" class="panel">
<h2>Acceso a la plataforma</h2>
<div class="grid">
<input id="email" type="email" placeholder="Correo electrónico" autocomplete="email">
<input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
</div><div class="row" style="margin-top:10px"><button id="login">Iniciar sesión</button><button class="alt" id="signup">Crear cuenta</button><button class="alt" id="reset">Restablecer contraseña</button></div>
<p class="muted small">Las cuentas nuevas quedan pendientes hasta que un administrador las apruebe.</p>
</section>
<section id="app" class="hidden">
<div class="panel"><div class="row"><div style="flex:1"><h2 id="welcome">Panel administrativo</h2><div class="muted small" id="who"></div></div><button class="alt" id="refresh">Actualizar</button><button id="logout">Cerrar sesión</button></div></div>
<div class="panel"><div class="nav" id="nav"></div></div>
<div class="panel" id="view"></div>
</section>
</main>
<script>
(() => {
const SUPABASE_URL = "https://alcplidjbnjuppoezhir.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D0B-fyB7x_ugOyQjTx8xjg_s95YUi4L";
const $ = id => document.getElementById(id);
const status = msg => { $("status").textContent = msg; $("status").classList.remove("hidden"); };
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if (!window.supabase) { status("No cargó la biblioteca Supabase. Comprueba la conexión a internet."); return; }
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let user=null, profile=null, tab="properties", cache={};
const defs = {
 properties:{label:"Propiedades",table:"properties",fields:[["name","Nombre de la propiedad"],["address","Dirección"],["allocation_method","Método de distribución (occupants/submeters)" ]]},
 apartments:{label:"Apartamentos",table:"apartments",fields:[["property_id","UUID de propiedad"],["name","Número o nombre del apartamento"],["responsible_name","Responsable"],["occupants","Número de ocupantes"]]},
 utility_bills:{label:"Facturas",table:"utility_bills",fields:[["property_id","UUID de propiedad"],["service","Servicio (agua/energía/gas)"],["billing_period","Periodo (ej. 2026-10)"],["amount","Valor total"],["issue_date","Fecha de emisión YYYY-MM-DD"],["due_date","Fecha de vencimiento YYYY-MM-DD" ]]},
 meter_readings:{label:"Lecturas",table:"meter_readings",fields:[["apartment_id","UUID de apartamento"],["service","Servicio/medidor"],["billing_period","Periodo (ej. 2026-10)"],["previous_reading","Lectura anterior"],["current_reading","Lectura actual"]]},
 payments:{label:"Pagos",table:"payments",fields:[["apartment_id","UUID de apartamento"],["concept","Concepto del pago"],["amount","Valor pagado"],["paid_at","Fecha de pago YYYY-MM-DD"],["method","Medio de pago"],["reference","Referencia (opcional)"]]},
 receipts:{label:"Recibos",table:"receipts",fields:[["apartment_id","UUID de apartamento"],["receipt_number","Número de recibo"],["billing_period","Periodo (ej. 2026-10)"],["concept","Concepto"],["amount","Valor"],["status","Estado (draft/sent/paid/void)"] ]}
};
const admin = () => profile?.role === "admin";
async function loadProfile(){
 const {data,error}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(error) throw error; profile=data;
 if(!profile || profile.approved !== true){ $("auth").classList.add("hidden"); $("app").classList.add("hidden"); status("Tu cuenta está pendiente de aprobación. Contacta al administrador."); return false; }
 return true;
}
async function refresh(){
 if(!user)return;
 try{if(!await loadProfile())return;
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("status").classList.add("hidden");
 $("who").textContent=(profile.display_name||user.email)+" · "+profile.role;
 renderNav();await renderTab();
 }catch(e){status("No se pudo cargar el perfil: "+e.message);}
}
function renderNav(){
 const entries=[...Object.entries(defs).map(([key,d])=>[key,d.label])];
 if(admin()) entries.push(["members","Colaboradores"]);
 entries.push(["ocr","Leer factura (OCR)"]); entries.push(["share","Imagen para WhatsApp"]);
 $("nav").innerHTML=entries.map(([k,l])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${esc(l)}</button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;renderNav();await renderTab();});
}
function fieldHTML([name,label]){
 const type=/(date|_at)$/.test(name)?"date":/(amount|occupants|reading)/i.test(name)?"number":"text";
 return `<label class="small">${esc(label)}<input name="${esc(name)}" ${type==="number"?'step="any"':''} type="${type}" placeholder="${esc(label)}" ${name==="reference"?'':'required'}></label>`;
}
async function renderTab(){
 const host=$("view");
 if(tab==="members"){return renderMembers(host);}
 if(tab==="ocr"){return renderOCR(host);}
 if(tab==="share"){return renderShareReceipt(host);}
 const d=defs[tab]; if(!d)return;
 host.innerHTML=`<h2>${esc(d.label)}</h2><form id="create" class="grid">${d.fields.map(fieldHTML).join("")}<div style="align-self:end"><button>Guardar registro</button></div></form><div class="tablewrap" id="records">Cargando...</div>`;
 $("create").onsubmit=async e=>{
  e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());
  for(const k of Object.keys(obj)) if(obj[k]==="")obj[k]=null;
  for(const k of Object.keys(obj)) if(obj[k]!==null && ["occupants","amount","previous_reading","current_reading"].includes(k))obj[k]=Number(obj[k]);
  if(["properties","apartments","utility_bills","meter_readings","payments"].includes(d.table)) obj.created_by=user.id;
  if(d.table==="receipts" && obj.status==="") obj.status="draft";
  const {error}=await db.from(d.table).insert(obj);
  if(error){status("No se pudo guardar: "+error.message);return;}
  status("Registro guardado.");e.target.reset();await renderTab();
 };
 const {data,error}=await db.from(d.table).select("*").order("created_at",{ascending:false}).limit(100);
 if(error){$("records").textContent="Error al consultar: "+error.message;return;}
 cache[tab]=data||[];
 if(!data?.length){$("records").innerHTML='<p class="muted">Todavía no hay registros o RLS no permite verlos.</p>';return;}
 const cols=Object.keys(data[0]).filter(k=>!["updated_at"].includes(k));
 $("records").innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th>Acción</th></tr></thead><tbody>${data.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join("")}<td>${r.id?`<button class="danger" data-del="${esc(r.id)}">Eliminar</button>`:"—"}</td></tr>`).join("")}</tbody></table>`;
 $("records").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!admin()){status("Solo el administrador puede eliminar desde esta interfaz.");return;}if(!confirm("¿Eliminar este registro?"))return;const {error}=await db.from(d.table).delete().eq("id",b.dataset.del);if(error)status("Error al eliminar: "+error.message);else{status("Registro eliminado.");await renderTab();}});
}
async function renderMembers(host){
 if(!admin()){host.textContent="Solo el administrador puede gestionar colaboradores.";return;}
 const {data:profiles,error}=await db.from("profiles").select("id,display_name,role,approved").order("display_name");
 if(error){host.textContent="Error: "+error.message;return;}
 const {data:props, error:pe}=await db.from("properties").select("id,name");
 host.innerHTML=`<h2>Gestión de colaboradores</h2><p class="muted">Aprueba, cambia el rol o revoca aprobación. Asigna acceso a una propiedad con su UUID.</p>
 <div class="tablewrap"><table><thead><tr><th>Usuario UUID</th><th>Nombre</th><th>Rol</th><th>Aprobado</th><th>Acciones</th></tr></thead><tbody>${(profiles||[]).map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.display_name)}</td><td>${esc(p.role)}</td><td>${p.approved?'Sí':'No'}</td><td><div class="row"><button data-approve="${esc(p.id)}" data-val="${!p.approved}">${p.approved?'Revocar':'Aprobar'}</button><button class="alt" data-role="${esc(p.id)}">Alternar administrador/colaborador</button></div></td></tr>`).join("")}</tbody></table></div>
 <h3 style="margin-top:18px">Asignar colaborador a propiedad</h3>
 ${pe?`<p>Error al cargar propiedades: ${esc(pe.message)}</p>`:`<form id="assign" class="grid"><label class="small">Usuario UUID<input name="user_id" required></label><label class="small">Propiedad<select name="property_id" required><option value="">Selecciona</option>${(props||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name||p.id)}</option>`).join("")}</select></label><button>Asignar acceso</button></form>`}
 <div id="memberresult" class="small muted"></div>`;
 host.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{const {error}=await db.from("profiles").update({approved:b.dataset.val==="true"}).eq("id",b.dataset.approve);status(error?"Error: "+error.message:"Estado actualizado.");await renderMembers(host);});
 host.querySelectorAll("[data-role]").forEach(b=>b.onclick=async()=>{const p=profiles.find(x=>x.id===b.dataset.role);const next=p.role==="admin"?"collaborator":"admin";if(!confirm(`¿Cambiar rol a ${next}?`))return;const {error}=await db.from("profiles").update({role:next}).eq("id",p.id);status(error?"Error: "+error.message:"Rol actualizado.");await renderMembers(host);});
 const form=host.querySelector("#assign");if(form)form.onsubmit=async e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(form).entries());const {error}=await db.from("property_members").insert(obj);$("memberresult").textContent=error?"Error al asignar: "+error.message:"Acceso asignado.";};
}

async function renderShareReceipt(host){
 const {data:receipts,error}=await db.from("receipts").select("*").order("created_at",{ascending:false}).limit(100);
 if(error){host.innerHTML=`<h2>Imagen para WhatsApp</h2><p>Error consultando recibos: ${esc(error.message)}</p>`;return;}
 const {data:apartments}=await db.from("apartments").select("id,name,responsible_name");
 const aptMap=Object.fromEntries((apartments||[]).map(a=>[a.id,a]));
 host.innerHTML=`<h2>Generar imagen de recibo</h2>
 <p class="muted">Selecciona un recibo registrado para crear una imagen PNG que puedas guardar y compartir por WhatsApp.</p>
 <label class="small">Recibo<select id="shareReceipt" required><option value="">Selecciona un recibo</option>${(receipts||[]).map(r=>`<option value="${esc(r.id)}">${esc(r.receipt_number||r.id)} · ${esc(r.concept||"Recibo")} · ${esc(r.amount)}</option>`).join("")}</select></label>
 <div class="receipt-actions"><button id="makeReceipt">Generar imagen PNG</button><button id="shareReceiptWA" class="alt" disabled>Compartir por WhatsApp</button></div>
 <div id="receiptPreview" class="item muted">La vista previa aparecerá aquí.</div>
 <p class="small muted">En iPhone, si el navegador no permite compartir el archivo directamente, descarga la imagen y adjúntala en WhatsApp.</p>`;
 let blob=null, file=null;
 $("makeReceipt").onclick=async()=>{
  const selected=(receipts||[]).find(r=>String(r.id)===$("shareReceipt").value);
  if(!selected){status("Selecciona un recibo.");return;}
  const apt=aptMap[selected.apartment_id]||{};
  const canvas=document.createElement("canvas");canvas.width=1080;canvas.height=1350;
  const c=canvas.getContext("2d");
  const bg=c.createLinearGradient(0,0,1080,1350);bg.addColorStop(0,"#071326");bg.addColorStop(.55,"#10294b");bg.addColorStop(1,"#050a14");
  c.fillStyle=bg;c.fillRect(0,0,1080,1350);
  c.strokeStyle="#d7ae55";c.lineWidth=8;c.strokeRect(34,34,1012,1282);
  c.strokeStyle="#5da9ff";c.lineWidth=2;c.strokeRect(52,52,976,1246);
  c.fillStyle="#f2cf79";c.font="bold 68px Georgia";c.textAlign="center";c.fillText("BERNAL",540,160);
  c.fillStyle="#f5e7c5";c.font="30px Arial";c.fillText("ADMINISTRACIÓN RESIDENCIAL",540,215);
  c.strokeStyle="#d7ae55";c.lineWidth=3;c.beginPath();c.moveTo(160,260);c.lineTo(920,260);c.stroke();
  c.fillStyle="#ffffff";c.font="bold 44px Arial";c.fillText("RECIBO DE PAGO",540,350);
  const rows=[
   ["Recibo",selected.receipt_number||String(selected.id).slice(0,12)],
   ["Apartamento",apt.name||selected.apartment_id||"No especificado"],
   ["Responsable",apt.responsible_name||"No especificado"],
   ["Periodo",selected.billing_period||"No especificado"],
   ["Concepto",selected.concept||"No especificado"],
   ["Estado",selected.status||"Pendiente"],
   ["Fecha",selected.created_at?new Date(selected.created_at).toLocaleDateString("es-CO"):""]
  ];
  let y=450;
  rows.forEach(([label,value])=>{
   c.textAlign="left";c.fillStyle="#d7ae55";c.font="bold 27px Arial";c.fillText(label.toUpperCase(),110,y);
   c.fillStyle="#ffffff";c.font="30px Arial";
   let txt=String(value);if(txt.length>34)txt=txt.slice(0,31)+"...";
   c.fillText(txt,430,y);y+=82;
  });
  c.strokeStyle="#d7ae55";c.lineWidth=3;c.beginPath();c.moveTo(110,y+8);c.lineTo(970,y+8);c.stroke();
  c.textAlign="center";c.fillStyle="#f2cf79";c.font="bold 62px Arial";
  const amount=Number(selected.amount||0).toLocaleString("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
  c.fillText(amount,540,y+110);
  c.fillStyle="#b9c9e3";c.font="24px Arial";c.fillText("Comprobante generado desde BERNAL",540,1230);
  c.fillStyle="#8ebeff";c.font="21px Arial";c.fillText("Conserve este comprobante para sus registros",540,1270);
  blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
  if(!blob){status("No se pudo generar la imagen.");return;}
  file=new File([blob],`recibo-bernal-${selected.receipt_number||selected.id}.png`,{type:"image/png"});
  const url=URL.createObjectURL(blob);
  $("receiptPreview").innerHTML=`<img alt="Vista previa del recibo" src="${url}" style="width:100%;max-width:430px;display:block;margin:auto;border-radius:12px"><p class="small">Imagen PNG lista para guardar o compartir.</p><a id="downloadReceipt" download="${esc(file.name)}" href="${url}">Descargar imagen del recibo</a>`;
  $("shareReceiptWA").disabled=false;
  $("shareReceiptWA").onclick=async()=>{
   try{
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
     await navigator.share({title:"Recibo BERNAL",text:"Recibo de Administración Residencial BERNAL",files:[file]});
    }else{
     const text=encodeURIComponent("Te comparto el recibo de Administración Residencial BERNAL. Descarga la imagen y adjúntala en WhatsApp.");
     window.open("https://wa.me/?text="+text,"_blank");
     status("Descarga la imagen y adjúntala en la conversación de WhatsApp.");
    }
   }catch(e){if(e.name!=="AbortError")status("No se pudo abrir compartir. Descarga la imagen y adjúntala en WhatsApp.");}
  };
  status("Imagen de recibo generada.");
 };
}

async function renderOCR(host){
 host.innerHTML=`<h2>Lectura de factura (OCR)</h2><p class="muted">Sube una imagen. La función devuelve una propuesta; revisa los datos antes de registrar la factura. PDF no está habilitado en esta versión.</p>
 <form id="ocrform" class="grid"><label class="small">UUID de propiedad<input name="propertyId" required></label><label class="small">Imagen de factura<input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></label><button>Analizar factura</button></form><pre id="ocrresult" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>`;
 $("ocrform").onsubmit=async e=>{e.preventDefault();const f=e.target.file.files[0];if(!f)return;if(f.size>12*1024*1024){$("ocrresult").textContent="La imagen supera 12 MB.";return;}
 const b64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=reject;r.readAsDataURL(f);});
 $("ocrresult").textContent="Procesando...";
 const {data:{session}}=await db.auth.getSession();
 const resp=await fetch(SUPABASE_URL+"/functions/v1/ocr-invoice",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({propertyId:e.target.propertyId.value,fileBase64:b64,mimeType:f.type})});
 $("ocrresult").textContent=JSON.stringify(await resp.json(),null,2);
 };
}
$("login").onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){status("No se pudo iniciar sesión: "+error.message);return;}user=data.user;await refresh();};
$("signup").onclick=async()=>{const {data,error}=await db.auth.signUp({email:$("email").value,password:$("password").value});if(error){status("No se pudo crear la cuenta: "+error.message);return;}status("Cuenta creada. Revisa tu correo si se requiere confirmación. Un administrador debe aprobar el perfil.");};
$("reset").onclick=async()=>{const {error}=await db.auth.resetPasswordForEmail($("email").value);status(error?"Error: "+error.message:"Si el correo existe, recibirás instrucciones para restablecer la contraseña.");};
$("logout").onclick=async()=>{await db.auth.signOut();user=null;profile=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden");status("Sesión cerrada.");};
$("refresh").onclick=refresh;
db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;if(user)setTimeout(refresh,0);});
db.auth.getSession().then(({data})=>{user=data.session?.user||null;if(user)refresh();});
})();
</script>
</body></html>

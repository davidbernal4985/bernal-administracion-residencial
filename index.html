<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BERNAL | Administración Residencial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#26384f;--gold:#c7a45a;--paper:#f7f6f2;--ink:#182235;--muted:#667085;--line:#e2e5eb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px system-ui,-apple-system,sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;padding:18px 20px;border-bottom:3px solid var(--gold)}header strong{font-family:Georgia,serif;letter-spacing:2px;font-size:22px}header small{display:block;color:#e7d6ad;letter-spacing:2px}
main{max-width:1100px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px #1020400a}
h2{margin:0 0 12px;font-size:19px}h3{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select,button{width:100%;padding:11px;border:1px solid #ccd2dc;border-radius:8px;font:inherit}button{background:var(--navy);color:white;border:0;cursor:pointer;font-weight:600}button.alt{background:#e8edf4;color:var(--navy)}button.danger{background:#9f2525}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{width:auto}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{width:auto;background:#e9edf3;color:var(--navy)}.nav button.active{background:var(--navy);color:white}.muted{color:var(--muted)}.status{padding:10px;border-radius:8px;background:#f5f0e3;margin-bottom:12px;white-space:pre-wrap}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}th{background:#f7f8fa}.tablewrap{overflow:auto}.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}.item strong{display:block}.small{font-size:12px}

/* Identidad oficial BERNAL: logo estático, sin destellos ni animaciones */
.brand-header{display:flex;align-items:center;gap:16px;background:#26384f;color:#fff;padding:14px 20px;border-bottom:3px solid #c7a45a;box-shadow:0 5px 18px #07132622}
.brand-header .brand-logo{width:82px;height:82px;object-fit:contain;border-radius:0;box-shadow:none;animation:none!important;flex:0 0 auto}
.brand-header .brand-copy{min-width:0}
.brand-header strong{display:block;font-family:Georgia,serif;letter-spacing:2px;font-size:28px;color:#f2cf79}
.brand-header small{display:block;color:#f1e4c3;letter-spacing:1px;font-size:12px;overflow-wrap:anywhere}
.brand-header:after{display:none!important}
.receipt-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
/* Menú lateral y área de trabajo */
.app-layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
.sidebar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:12px;box-shadow:0 4px 16px #1020400a;min-width:0}
.side-label{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted);padding:8px 10px 12px}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0}
.nav button{width:100%;text-align:left;background:transparent;color:var(--navy);padding:11px 12px;border-radius:9px;border:0;font-size:15px;min-height:44px}
.nav button{display:flex;align-items:center;gap:9px;font-size:14px;padding:9px 10px;min-height:40px}.nav-ico{display:inline-grid;place-items:center;width:24px;flex:0 0 24px;font-size:18px}.service-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:4px 0 16px}.service-tile{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink);text-align:left;min-height:108px}.service-tile.chosen{border:2px solid var(--gold);background:#fbf7ec}.service-tile span{font-size:27px}.service-tile strong{font-size:14px}.service-tile small{font-size:12px;color:var(--muted)}.nav button:hover{background:#f4f0e6}
.nav button.active{background:var(--navy);color:#fff;border-left:3px solid var(--gold)}
.workspace{min-width:0}
.workspace>.panel{min-width:0}
.tablewrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{width:100%;min-width:760px;border-collapse:collapse;table-layout:auto}
th,td{overflow-wrap:normal;word-break:normal;white-space:normal;vertical-align:top}
th{white-space:nowrap}
input,select,textarea{max-width:100%;min-width:0}
@media(max-width:760px){
 .app-layout{grid-template-columns:1fr;gap:12px}
 .sidebar{position:static;padding:10px}
 .side-label{padding:4px 8px 8px}
 .nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.service-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
 .nav button{font-size:14px;padding:10px;min-width:0;white-space:normal;overflow-wrap:anywhere}
 .brand-header{padding:12px;gap:12px}
 .brand-header .brand-logo{width:68px;height:68px}
 .brand-header strong{font-size:clamp(21px,6vw,28px)}
 .brand-header small{font-size:10px;letter-spacing:.5px}
 .row button{max-width:100%}
 .grid{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:380px){.nav{grid-template-columns:1fr}.brand-header .brand-logo{width:56px;height:56px}}
</style>
</head>

<script>
(() => {
const SUPABASE_URL = "https://alcplidjbnjuppoezhir.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D0B-fyB7x_ugOyQjTx8xjg_s95YUi4L";
const $ = id => document.getElementById(id);
const status = msg => { $("status").textContent = msg; $("status").classList.remove("hidden"); };
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if (!window.supabase) { status("No cargó la biblioteca Supabase. Comprueba la conexión a internet."); return; }
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let user=null, profile=null, tab="properties", cache={};
const defs = {
 properties:{label:"Propiedades",table:"properties",fields:[["name","Nombre de la propiedad"],["address","Dirección"],["allocation_method","Cómo dividir los servicios" ]]},
 apartments:{label:"Apartamentos",table:"apartments",fields:[["property_id","Propiedad"],["name","Número o nombre del apartamento"],["responsible_name","Responsable"],["occupants","Número de ocupantes"]]},
 utility_bills:{label:"Servicios",table:"utility_bills",fields:[["property_id","Propiedad o casa"],["service","Servicio"],["allocation_method","Cómo dividir el cobro"],["billing_period","Periodo (ej. 2026-10)"],["amount","Valor total de la factura"],["issue_date","Fecha de emisión"],["due_date","Fecha de vencimiento"]]},
 meter_readings:{label:"Contadores",table:"meter_readings",fields:[["apartment_id","Apartamento"],["service","Servicio/medidor"],["billing_period","Periodo (ej. 2026-10)"],["previous_reading","Lectura anterior"],["current_reading","Lectura actual"]]},
 payments:{label:"Pagos",table:"payments",fields:[["apartment_id","Apartamento"],["concept","Concepto del pago"],["amount","Valor pagado"],["paid_at","Fecha de pago YYYY-MM-DD"],["method","Medio de pago"],["reference","Referencia (opcional)"]]},
 receipts:{label:"Recibos",table:"receipts",fields:[["apartment_id","Apartamento"],["receipt_number","Número de recibo"],["billing_period","Periodo (ej. 2026-10)"],["concept","Concepto"],["amount","Valor"],["status","Estado (draft/sent/paid/void)"] ]}
};
const admin = () => profile?.role === "admin";
async function loadProfile(){
 const {data,error}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(error) throw error; profile=data;
 if(!profile || profile.approved !== true){ $("auth").classList.add("hidden"); $("app").classList.add("hidden"); status("Tu cuenta está pendiente de aprobación. Contacta al administrador."); return false; }
 return true;
}
async function refresh(){
 if(!user)return;
 try{if(!await loadProfile())return;
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("status").classList.add("hidden");
 $("who").textContent=(profile.display_name||user.email)+" · "+profile.role;
 renderNav();await renderTab();
 }catch(e){status("No se pudo cargar el perfil: "+e.message);}
}
function renderNav(){
 const entries=[...Object.entries(defs).map(([key,d])=>[key,d.label])];
 if(admin()) entries.push(["members","Colaboradores"]);
 entries.push(["distribution","Calcular cobros"]); entries.push(["ocr","Leer factura"]); entries.push(["share","Recibos para compartir"]);
 const icons={properties:"🏢",apartments:"🚪",utility_bills:"🔌",meter_readings:"🔢",payments:"💳",receipts:"🧾",members:"👥",distribution:"🧮",ocr:"📷",share:"📲"};
 $("nav").innerHTML=entries.map(([k,l])=>`<button class="${tab===k?'active':''}" data-tab="${k}"><span class="nav-ico">${icons[k]||"•"}</span><span>${esc(l)}</span></button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;renderNav();await renderTab();});
}
function fieldHTML([name,label], choices=[]){
 if(name==="property_id" || name==="apartment_id") return `<label class="small">${esc(label)}<select name="${esc(name)}" required><option value="">Selecciona ${name==="property_id"?"una propiedad":"un apartamento"}</option>${choices.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.number||"Sin nombre")}${x.property_name?" · "+esc(x.property_name):""}</option>`).join("")}</select></label>`;
 if(name==="service") return `<label class="small">Servicio<select name="service" required><option value="">Selecciona un servicio</option><option value="water">💧 Agua (m³)</option><option value="electricity">⚡ Electricidad (kWh)</option><option value="gas">🔥 Gas (m³)</option><option value="other">🔧 Otro servicio</option></select></label>`;
 const type=/(date|_at)$/.test(name)?"date":/(amount|occupants|reading)/i.test(name)?"number":"text";
 return `<label class="small">${esc(label)}<input name="${esc(name)}" ${type==="number"?'step="any"':''} type="${type}" placeholder="${esc(label)}" ${name==="reference"?'':'required'}></label>`;
}
async function renderTab(){
 const host=$("view");
 if(tab==="members"){return renderMembers(host);}
 if(tab==="distribution"){return renderDistribution(host);}

async function renderDistribution(host){
 const [{data:bills,error:be},{data:properties,error:pe},{data:apartments,error:ae}]=await Promise.all([
  db.from("utility_bills").select("*").order("created_at",{ascending:false}).limit(200),
  db.from("properties").select("id,name,allocation_method"),
  db.from("apartments").select("id,property_id,name,responsible_name,occupants")
 ]);
 if(be||pe||ae){host.innerHTML=`<h2>Distribuir cobros</h2><p>No se pudieron cargar los datos: ${esc((be||pe||ae).message)}</p>`;return;}
 const billList=bills||[], propList=properties||[], aptList=apartments||[];
 host.innerHTML=`<h2>Distribuir cobros por apartamento</h2><p class="muted">Elige una factura, define el método para ese servicio y periodo, revisa los importes calculados y confirma para crear los recibos. Puedes corregir cada importe antes de confirmar.</p>
 <div class="grid"><label class="small">Factura<select id="distBill"><option value="">Selecciona una factura</option>${billList.map(b=>`<option value="${esc(b.id)}">${esc((propList.find(p=>p.id===b.property_id)||{}).name||b.property_id)} · ${esc(b.service)} · ${esc(b.billing_period||'Sin periodo')} · ${cop(b.amount)}</option>`).join('')}</select></label>
 <label class="small">Método de distribución para este servicio<select id="distMethod"><option value="occupants">Por número de ocupantes</option><option value="submeters">Por consumo de medidores individuales</option></select></label></div>
 <div id="distInfo" class="small muted" style="margin:10px 0"></div><div id="distRows"></div><div class="actions"><button id="saveDist" disabled>Confirmar importes y crear recibos</button></div>`;
 const cop=n=>Number(n||0).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
 let computed=[];
 const billSelect=host.querySelector('#distBill'), methodSelect=host.querySelector('#distMethod');
 async function loadDistribution(){
  const bill=billList.find(b=>b.id===billSelect.value); const rowsHost=host.querySelector('#distRows');
  if(!bill){rowsHost.innerHTML='';host.querySelector('#saveDist').disabled=true;host.querySelector('#distInfo').textContent='';return;}
  const property=propList.find(p=>p.id===bill.property_id); const units=aptList.filter(a=>a.property_id===bill.property_id);
  if(!units.length){rowsHost.innerHTML='<p>No hay apartamentos creados para esta propiedad.</p>';host.querySelector('#saveDist').disabled=true;return;}
  let method=methodSelect.value;
  try{
   const {data:configs,error:ce}=await db.from('utility_configs').select('allocation_method,billing_unit').eq('property_id',bill.property_id).eq('service',bill.service).maybeSingle();
   if(!ce&&configs&&methodSelect.dataset.manual!=='1'){method=configs.allocation_method||method;methodSelect.value=method;}
  }catch(_){ }
  let readings=[]; const {data:rr,error:re}=await db.from('meter_readings').select('*').in('apartment_id',units.map(a=>a.id)).eq('billing_period',bill.billing_period||'').eq('service',bill.service);
  if(!re) readings=rr||[];
  const usageByApt={}; for(const r of readings){usageByApt[r.apartment_id]=(usageByApt[r.apartment_id]||0)+Math.max(0,Number(r.current_reading||0)-Number(r.previous_reading||0));}
  const totalUsage=Object.values(usageByApt).reduce((a,b)=>a+b,0);
  const totalPeople=units.reduce((a,b)=>a+Math.max(0,Number(b.occupants||0)),0);
  const actualTotal=Number(bill.amount||0); const metadata=bill.extracted_data||{}; const generalUsage=Number(metadata.consumption_total??bill.consumption_total??0);
  const canUseMeters=method==='submeters'&&totalUsage>0;
  computed=units.map(a=>{
   const usage=Number(usageByApt[a.id]||0); const weight=canUseMeters?usage:(totalPeople>0?Math.max(0,Number(a.occupants||0))/totalPeople:1/units.length);
   const ratio=canUseMeters?usage/totalUsage:weight;
   return {apartment:a,usage,ratio,amount:Math.round(actualTotal*ratio)};
  });
  // Put rounding remainder into the final apartment so amounts add up to the invoice total.
  const diff=Math.round(actualTotal)-computed.reduce((sum,x)=>sum+x.amount,0); if(computed.length)computed[computed.length-1].amount+=diff;
  const allocated=computed.reduce((sum,x)=>sum+x.amount,0);
  const reconciliation=generalUsage>0&&canUseMeters?`Consumo de la factura: ${generalUsage} ${esc(metadata.billing_unit||bill.billing_unit||'unidades')}. Suma de medidores individuales: ${totalUsage.toFixed(3)}. Diferencia: ${(generalUsage-totalUsage).toFixed(3)}.`:'La factura no tiene consumo general identificado; revisa las lecturas antes de confirmar.';
  host.querySelector('#distInfo').innerHTML=`Método aplicado: <b>${canUseMeters?'medidores individuales': 'ocupantes'}</b>. Total factura: <b>${cop(actualTotal)}</b>. Total distribuido: <b>${cop(allocated)}</b>. ${method==='submeters'&&!canUseMeters?'<span style="color:#9a5b00">No hay lecturas válidas para este periodo y servicio; se calculó por ocupantes como alternativa.</span>':''}<br>${reconciliation}`;
  rowsHost.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Apartamento</th><th>Responsable</th><th>Ocupantes</th><th>Consumo individual</th><th>Proporción</th><th>Cobro editable (COP)</th></tr></thead><tbody>${computed.map((x,i)=>`<tr><td>${esc(x.apartment.name)}</td><td>${esc(x.apartment.responsible_name||'—')}</td><td>${Number(x.apartment.occupants||0)}</td><td>${x.usage.toFixed(3)}</td><td>${(x.ratio*100).toFixed(2)}%</td><td><input data-dist-amount="${i}" type="number" min="0" step="1" value="${x.amount}" style="min-width:125px"></td></tr>`).join('')}</tbody></table></div>`;
  rowsHost.querySelectorAll('[data-dist-amount]').forEach(input=>input.onchange=()=>{computed[Number(input.dataset.distAmount)].amount=Math.max(0,Math.round(Number(input.value||0)));});
  host.querySelector('#saveDist').disabled=false;
 }
 billSelect.onchange=async()=>{methodSelect.dataset.manual='';await loadDistribution();};
 methodSelect.onchange=async()=>{methodSelect.dataset.manual='1';const b=billList.find(x=>x.id===billSelect.value);if(b){const {error}=await db.from('utility_configs').upsert({property_id:b.property_id,service:b.service,allocation_method:methodSelect.value,billing_unit:b.billing_unit||null,updated_by:user.id},{onConflict:'property_id,service'});if(error&& !/utility_configs|schema cache|does not exist/i.test(error.message))status('No se pudo guardar el método: '+error.message);}await loadDistribution();};
 host.querySelector('#saveDist').onclick=async()=>{
  const bill=billList.find(b=>b.id===billSelect.value);if(!bill||!computed.length)return;
  if(!confirm(`¿Crear ${computed.length} recibos para ${bill.billing_period||'este periodo'} por un total de ${cop(computed.reduce((s,x)=>s+x.amount,0))}?`))return;
  const {data:existing,error:ex}=await db.from('receipts').select('apartment_id').eq('billing_period',bill.billing_period||'').eq('concept',`${bill.service} - ${bill.billing_period||'Factura'}`);
  if(ex){status('No se pudo comprobar si ya existen recibos: '+ex.message);return;}
  const already=new Set((existing||[]).map(x=>x.apartment_id));
  const pending=computed.filter(x=>!already.has(x.apartment.id));
  if(!pending.length){status('Ya existen recibos para todos los apartamentos en este servicio y periodo. No se duplicaron.');return;}
  const rows=pending.map((x,i)=>({apartment_id:x.apartment.id,receipt_number:`BER-${String(bill.billing_period||new Date().toISOString().slice(0,7)).replace(/[^0-9A-Za-z]/g,'')}-${String(x.apartment.name||x.apartment.id).replace(/[^0-9A-Za-z]/g,'').slice(0,8)}-${Date.now().toString().slice(-5)}${i}`,billing_period:bill.billing_period||null,concept:`${bill.service} - ${bill.billing_period||'Factura'}`,amount:x.amount,status:'draft',created_by:user.id}));
  const {error}=await db.from('receipts').insert(rows);if(error){status('Error creando recibos: '+error.message);return;}status(`Se crearon ${rows.length} recibos. Puedes generar sus imágenes desde “Imagen para WhatsApp”.`);await renderTab();
 };
}
function columnLabel(k){return ({name:"Nombre",address:"Dirección",allocation_method:"Forma de dividir",service:"Servicio",billing_period:"Periodo",amount:"Valor",issue_date:"Fecha de emisión",due_date:"Vencimiento",apartment_id:"Apartamento",property_id:"Propiedad",previous_reading:"Contador anterior",current_reading:"Contador actual",occupants:"Ocupantes",responsible_name:"Responsable",receipt_number:"N.º de recibo",concept:"Concepto",status:"Estado",paid_at:"Fecha de pago",method:"Medio de pago",reference:"Referencia",general_previous_reading:"Lectura general anterior",general_current_reading:"Lectura general actual",consumption_total:"Consumo total",billing_unit:"Unidad"})[k]||k;}
function displayValue(k,v){const maps={service:{water:"Agua",electricity:"Electricidad",gas:"Gas",other:"Otro servicio"},allocation_method:{occupants:"Por ocupantes",submeters:"Por contadores individuales"},status:{draft:"Pendiente",sent:"Enviado",paid:"Pagado",void:"Anulado"},role:{admin:"Administrador",collaborator:"Colaborador",pending:"Pendiente"}};return maps[k]?.[v]||v;}
function cop(n){return Number(n||0).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});}

async function renderShareReceipt(host){

 if(error){host.innerHTML=`<h2>Imagen para WhatsApp</h2><p>Error consultando recibos: ${esc(error.message)}</p>`;return;}
 const {data:apartments}=await db.from("apartments").select("id,name,responsible_name");
 const aptMap=Object.fromEntries((apartments||[]).map(a=>[a.id,a]));
 host.innerHTML=`<h2>Generar imagen de recibo</h2>
 <p class="muted">Selecciona un recibo registrado para crear una imagen PNG que puedas guardar y compartir por WhatsApp.</p>
 <label class="small">Recibo<select id="shareReceipt" required><option value="">Selecciona un recibo</option>${(receipts||[]).map(r=>`<option value="${esc(r.id)}">${esc(r.receipt_number||r.id)} · ${esc(r.concept||"Recibo")} · ${esc(r.amount)}</option>`).join("")}</select></label>

  c.fillStyle="#596579";c.font="30px Arial";c.fillText("ADMINISTRACIÓN RESIDENCIAL",540,215);
  c.strokeStyle="#d7ae55";c.lineWidth=3;c.beginPath();c.moveTo(160,260);c.lineTo(920,260);c.stroke();

   ["Periodo",selected.billing_period||"No especificado"],
   ["Concepto",selected.concept||"No especificado"],

   c.fillStyle="#273449";c.font="30px Arial";
   let txt=String(value);if(txt.length>34)txt=txt.slice(0,31)+"...";

async function renderOCR(host){
 const {data:propertiesData,error:propertiesError}=await db.from("properties").select("id,name").order("name");
 const properties=propertiesData||[]; cache.properties=properties;
 if(propertiesError){host.innerHTML=`<h2>Leer factura</h2><p>No se pudieron cargar las propiedades: ${esc(propertiesError.message)}</p>`;return;}
 host.innerHTML=`<h2>Leer factura automáticamente</h2>

 <form id="ocrform" class="grid">
 <label class="small">Casa / propiedad<select name="propertyId" required><option value="">Selecciona la propiedad</option>${properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>

 <label class="small">Foto o PDF de la factura<input name="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,.pdf" required></label>
 <div class="small muted">Formatos: JPG, PNG, WEBP y PDF. Máximo 15 MB. La extracción es una sugerencia y debe revisarse.</div>
 <button id="analyzeInvoice">Analizar factura</button></form>
 <div id="ocrreview" class="hidden"></div><pre id="ocrresult" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>`;
 const form=$("ocrform");
 form.onsubmit=async e=>{
  e.preventDefault();
  const file=form.elements.file.files[0]; if(!file)return;
  if(file.size>15*1024*1024){status("El archivo supera 15 MB. Reduce el tamaño e inténtalo de nuevo.");return;}
  if(!properties.length){status("Primero crea una propiedad en el módulo Propiedades.");return;}
  const btn=$("analyzeInvoice");btn.disabled=true;btn.textContent="Analizando documento…";$("ocrresult").textContent="Subiendo archivo de forma privada y leyendo la factura…";
  try{
   const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const path=`${user.id}/${Date.now()}-${safeName}`;
   const {error:uploadError}=await db.storage.from("invoices").upload(path,file,{contentType:file.type|| (file.name.toLowerCase().endsWith(".pdf")?"application/pdf":"image/jpeg"),upsert:false});
   if(uploadError)throw new Error("No se pudo subir la factura: "+uploadError.message+". Comprueba que exista el bucket privado invoices y sus políticas.");
   const {data:{session}}=await db.auth.getSession();if(!session)throw new Error("La sesión caducó. Inicia sesión otra vez.");
   const resp=await fetch(SUPABASE_URL+"/functions/v1/ocr-invoice",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({path,service:form.elements.service.value,propertyId:form.elements.propertyId.value})});
   const payload=await resp.json();if(!resp.ok)throw new Error(payload.error||`El OCR respondió ${resp.status}.`); if(payload.error && !payload.extracted) throw new Error(payload.error);
   showInvoiceReview({payload,path,propertyId:form.elements.propertyId.value,service:form.elements.service.value,fileName:file.name});
   $("ocrresult").textContent="Documento analizado. Revisa y corrige los campos antes de guardar.";
  }catch(err){$("ocrresult").textContent=err.message||String(err);}
  finally{btn.disabled=false;btn.textContent="Analizar factura";}
 };
 function showInvoiceReview({payload,path,propertyId,service,fileName}){
  const x=payload.extracted||payload.suggested||{};
  const unit=service==="water"||service==="gas"?"m³":service==="electricity"?"kWh":(x.unit||"");
  const value=(...keys)=>{for(const k of keys){if(x[k]!==undefined&&x[k]!==null&&x[k]!=="")return x[k]}return ""};
  const host=$("ocrreview");host.classList.remove("hidden");
  host.innerHTML=`<div class="panel" style="margin-top:14px"><h3>Revisar datos extraídos</h3><p class="muted">Archivo: ${esc(fileName)}. No se guarda ningún valor hasta que pulses Guardar factura.</p>
   <form id="saveOCRBill" class="grid">
   <label class="small">Periodo de facturación<input name="billing_period" placeholder="Ej. 2026-10" value="${esc(value("billing_period","period","billingPeriod"))}"></label>
   <label class="small">Consumo total (${esc(unit||"unidad indicada en factura")})<input name="consumption_total" type="number" min="0" step="any" value="${esc(value("consumption_total","total_consumption","consumption","usage"))}"></label>
   <label class="small">Unidad detectada<input name="billing_unit" value="${esc(unit||value("billing_unit","unit","consumption_unit"))}" ${service==="other"?"":"readonly"}></label>
   <label class="small">Total a pagar (COP)<input name="amount" type="number" min="0" step="0.01" required value="${esc(value("amount","total_amount","total_due","amount_due","total_payable"))}"></label>
   <label class="small">Fecha de emisión<input name="issue_date" type="date" value="${esc(value("issue_date","issueDate"))}"></label>
   <label class="small">Fecha límite de pago<input name="due_date" type="date" value="${esc(value("due_date","dueDate","due_date_iso"))}"></label>
   <label class="small">Lectura anterior<input name="general_previous_reading" type="number" min="0" step="any" value="${esc(value("general_previous_reading","previous_reading"))}"></label>
   <label class="small">Lectura actual<input name="general_current_reading" type="number" min="0" step="any" value="${esc(value("general_current_reading","current_reading"))}"></label>
   <label class="small">Empresa de servicios<input name="provider" value="${esc(value("provider","utility_company","company"))}"></label>
   <label class="small">Número de factura<input name="invoice_number" value="${esc(value("invoice_number","bill_number","account_number"))}"></label>
   <label class="small" style="grid-column:1/-1">Texto leído (para verificar)<textarea name="ocr_text" rows="5">${esc(payload.text||"")}</textarea></label>
   <div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap"><button type="submit">Guardar factura revisada</button><button type="button" class="alt" id="cancelOCR">Cancelar</button></div></form></div>`;
  $("cancelOCR").onclick=()=>host.classList.add("hidden");
  $("saveOCRBill").onsubmit=async ev=>{
   ev.preventDefault();const f=ev.target;const n=Object.fromEntries(new FormData(f).entries());
   const amount=Number(n.amount);if(!Number.isFinite(amount)||amount<0){status("Escribe un valor válido para la factura.");return;}
   const ext={...x,provider:n.provider,invoice_number:n.invoice_number,consumption_total:n.consumption_total===""?null:Number(n.consumption_total),billing_unit:n.billing_unit,ocr_text:n.ocr_text,ocr_needs_review:true,original_file:fileName};
   const row={property_id:propertyId,service, billing_period:n.billing_period||null,amount,issue_date:n.issue_date||null,due_date:n.due_date||null,storage_path:path,extracted_data:ext,created_by:user.id};
   if(n.general_previous_reading!=="")ext.general_previous_reading=Number(n.general_previous_reading);
   if(n.general_current_reading!=="")ext.general_current_reading=Number(n.general_current_reading);
   const {error}=await db.from("utility_bills").insert(row);
   if(error){status("No se pudo guardar la factura: "+error.message);return;}
   status("Factura guardada en Supabase. Revisa el módulo Facturas para confirmar el registro.");host.classList.add("hidden");$("ocrresult").textContent="Factura guardada correctamente.";
   await renderNav();
  };
 }
}
$("login").onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){status("No se pudo iniciar sesión: "+error.message);return;}user=data.user;await refresh();};
$("signup").onclick=async()=>{const {data,error}=await db.auth.signUp({email:$("email").value,password:$("password").value});if(error){status("No se pudo crear la cuenta: "+error.message);return;}status("Cuenta creada. Revisa tu correo si se requiere confirmación. Un administrador debe aprobar el perfil.");};
$("reset").onclick=async()=>{const {error}=await db.auth.resetPasswordForEmail($("email").value);status(error?"Error: "+error.message:"Si el correo existe, recibirás instrucciones para restablecer la contraseña.");};
$("logout").onclick=async()=>{await db.auth.signOut();user=null;profile=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden");status("Sesión cerrada.");};
$("refresh").onclick=refresh;
db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;if(user)setTimeout(refresh,0);});
db.auth.getSession().then(({data})=>{user=data.session?.user||null;if(user)refresh();});
})();
</script>
</body></html>

<html lang="es">
<head>

<title>BERNAL | Administración Residencial</title>
<style>
:root{--bg:#101216;--panel:#191c22;--panel2:#20242c;--gold:#c8a96a;--gold2:#ead6a3;--text:#f4f2ed;--muted:#a4a7ae;--line:#353943;--red:#e58d8d;--green:#8bc6a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#0b0d10;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:12px;align-items:center;padding:8px}.logo{width:48px;height:48px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold2);position:relative;flex:0 0 48px}.logo svg{display:block}.brand b{letter-spacing:3px;font-size:19px}.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:1.4px}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:var(--muted);padding:12px 14px;text-align:left;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#25221a;color:var(--gold2)}.sidebar-note{margin-top:auto;color:#777d87;font-size:12px;padding:8px}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.topbar h1{font-size:19px;margin:0;font-weight:600}.top-actions{display:flex;gap:10px;align-items:center}.content{padding:28px;max-width:1450px;margin:auto}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h2{margin:4px 0;font-size:28px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px}.btn.primary{background:var(--gold);color:#17130c;border-color:var(--gold);font-weight:700}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.metric-label{color:var(--muted);font-size:13px}.metric{font-size:28px;font-weight:700;margin:8px 0 3px}.metric-sub{font-size:12px;color:var(--muted)}.section-title{font-size:17px;margin:0 0 14px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.quicklinks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px;text-align:left;color:var(--text)}.quick strong{display:block;margin-bottom:4px}.quick span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px;font-size:14px;vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:600}tr:last-child td{border-bottom:0}.empty{padding:28px;text-align:center;color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;background:#30343d;color:#d7d9df}.pill.ok{color:var(--green);background:#20352b}.pill.warn{color:#edcc83;background:#3b3020}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#101318;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.field textarea{min-height:82px;resize:vertical}.modal-back{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-back.show{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{border:1px solid #665632;background:#292419;color:#e6d6ad;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px}.footer-note{font-size:12px;color:#858b95;margin-top:22px}.mobile-menu{display:none}.hide{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none;position:fixed;z-index:4;inset:0 auto 0 0;width:270px}.sidebar.open{display:flex}.mobile-menu{display:inline-flex}.content{padding:18px}.topbar{padding:0 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.pagehead h2{font-size:24px}}
@media(max-width:520px){.cards{gap:9px}.card{padding:13px}.metric{font-size:23px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.pagehead{flex-direction:column}.topbar h1{font-size:16px}.top-actions .btn{padding:8px 10px}.quicklinks{grid-template-columns:1fr}}
.brand-official{display:block!important;padding:0!important;margin:0 0 22px!important;border:0!important}.brand-official .official-logo{display:block;width:100%;max-width:300px;height:auto;object-fit:contain;border-radius:12px;margin:0 auto 0 0}@media(max-width:520px){.brand-official .official-logo{max-width:270px}} 
</style>

<script>
const DBKEY='bernal_residencial_v2';
const emptyDB={properties:[],apartments:[],bills:[],readings:[],payments:[],receipts:[],users:[],settings:{currency:'COP',adminName:'Administrador principal'}};
let db=loadDB(),page='dashboard',modalSave=null;
function loadDB(){try{return {...structuredClone(emptyDB),...JSON.parse(localStorage.getItem(DBKEY)||'{}')}}catch{return structuredClone(emptyDB)}}
function saveDB(){localStorage.setItem(DBKEY,JSON.stringify(db));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:db.settings.currency||'COP',maximumFractionDigits:0}).format(Number(n)||0)}
function date(s){if(!s)return '—';return new Date(s+'T12:00:00').toLocaleDateString('es-CO')}
function nameOf(list,id,label='name'){return list.find(x=>String(x.id)===String(id))?.[label]||'Sin asignar'}
function propertyOptions(){return db.properties.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function apartmentOptions(){return db.apartments.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(nameOf(db.properties,x.propertyId))}</option>`).join('')}
const titles={dashboard:'Panel principal',properties:'Propiedades',apartments:'Apartamentos',bills:'Facturas',readings:'Lecturas y consumos',payments:'Pagos',receipts:'Recibos',users:'Usuarios',settings:'Configuración'};
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('sidebar').classList.remove('open');render()});
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('closeModal').onclick=document.getElementById('cancelModal').onclick=closeModal;
document.getElementById('saveModal').onclick=()=>{if(modalSave)modalSave();};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bernal-respaldo.json';a.click();URL.revokeObjectURL(a.href)};
function openModal(title,body,onSave){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;modalSave=onSave;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show');modalSave=null}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function field(label,id,type='text',opts='',required=true){return `<div class="field"><label for="${id}">${label}${required?' *':''}</label>${type==='select'?`<select id="${id}" ${required?'required':''}><option value="">Seleccionar</option>${opts}</select>`:`<input id="${id}" type="${type}" ${required?'required':''}>`}</div>`}
function showEmpty(msg){return `<div class="empty">${msg}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function actionBtn(label,act,id){return `<button class="btn" data-act="${act}" data-id="${id}">${label}</button>`}
function render(){
 document.getElementById('topTitle').textContent=titles[page];
 const v=document.getElementById('view');
 if(page==='dashboard'){
  const total=db.bills.reduce((s,x)=>s+Number(x.amount||0),0),paid=db.payments.reduce((s,x)=>s+Number(x.amount||0),0);
  v.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Control residencial</div><h2>Administración clara, consumo bajo control.</h2><div class="muted">Resumen general de tus propiedades y servicios.</div></div><button class="btn primary" data-new="bill">＋ Registrar factura</button></div>
  <div class="notice">Esta versión guarda los registros en el navegador de este dispositivo. Aún no está conectada a Supabase ni tiene autenticación segura. No ingreses datos sensibles ni la uses todavía para administrar facturas reales.</div>
  <div class="cards"><div class="card"><div class="metric-label">Propiedades</div><div class="metric">${db.properties.length}</div><div class="metric-sub">Registradas en este dispositivo</div></div><div class="card"><div class="metric-label">Apartamentos</div><div class="metric">${db.apartments.length}</div><div class="metric-sub">Unidades registradas</div></div><div class="card"><div class="metric-label">Facturas registradas</div><div class="metric">${db.bills.length}</div><div class="metric-sub">Total ${money(total)}</div></div><div class="card"><div class="metric-label">Pagos registrados</div><div class="metric">${money(paid)}</div><div class="metric-sub">Total acumulado</div></div></div>

 }else if(page==='readings'){
  v.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Medición</div><h2>Lecturas y consumos</h2><div class="muted">Consumo calculado como lectura actual menos lectura anterior.</div></div><button class="btn primary" data-new="reading">＋ Nueva lectura</button></div>${db.readings.length?table(['Apartamento','Servicio','Periodo','Anterior','Actual','Consumo'],db.readings.slice().reverse().map(r=>`<tr><td>${esc(nameOf(db.apartments,r.apartmentId))}</td><td>${esc(r.service)}</td><td>${esc(r.period)}</td><td>${r.previous}</td><td>${r.current}</td><td><b>${Math.max(0,Number(r.current)-Number(r.previous)).toLocaleString('es-CO')}</b></td></tr>`).join('')):showEmpty('Aún no hay lecturas. Registra la lectura anterior y la actual para cada unidad.')}`;
 }else if(page==='payments'){
  v.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Caja</div><h2>Pagos</h2><div class="muted">Registro de pagos recibidos por unidad o responsable.</div></div><button class="btn primary" data-new="payment">＋ Registrar pago</button></div>${db.payments.length?table(['Fecha','Apartamento','Concepto','Valor','Método','Referencia'],db.payments.slice().reverse().map(p=>`<tr><td>${date(p.date)}</td><td>${esc(nameOf(db.apartments,p.apartmentId))}</td><td>${esc(p.concept)}</td><td>${money(p.amount)}</td><td>${esc(p.method||'—')}</td><td>${esc(p.reference||'—')}</td></tr>`).join('')):showEmpty('Todavía no hay pagos registrados.')}`;
 }else if(page==='receipts'){
  v.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Cobros individuales</div><h2>Recibos</h2><div class="muted">Crea un borrador imprimible por apartamento. Revisa siempre los cálculos antes de enviarlo.</div></div><button class="btn primary" data-new="receipt">＋ Crear recibo</button></div>${db.receipts.length?table(['Número','Apartamento','Periodo','Concepto','Total','Estado','Acción'],db.receipts.slice().reverse().map(r=>`<tr><td>${esc(r.number)}</td><td>${esc(nameOf(db.apartments,r.apartmentId))}</td><td>${esc(r.period)}</td><td>${esc(r.concept)}</td><td>${money(r.amount)}</td><td><span class="pill ${r.status==='Enviado'?'ok':'warn'}">${esc(r.status)}</span></td><td>${actionBtn('Ver / imprimir','print-receipt',r.id)}</td></tr>`).join('')):showEmpty('No hay recibos. Crea uno cuando hayas verificado el reparto de gastos.')}`;
 }else if(page==='users'){
  v.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Accesos</div><h2>Usuarios</h2><div class="muted">Vista de diseño. La aprobación de usuarios y los permisos reales requieren autenticación y políticas de Supabase.</div></div></div><div class="notice">No agregues contraseñas aquí. Esta sección aún no crea cuentas ni protege datos.</div>${showEmpty('La administración segura de usuarios se habilitará al conectar Supabase.')}`;
 }else{
  v.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Sistema</div><h2>Configuración</h2><div class="muted">Preferencias básicas y respaldo.</div></div></div><div class="panel"><div class="form-grid"><div class="field"><label>Nombre del administrador</label><input id="settingAdmin" value="${esc(db.settings.adminName||'')}"></div><div class="field"><label>Moneda</label><select id="settingCurrency"><option value="COP" ${db.settings.currency==='COP'?'selected':''}>COP — Peso colombiano</option><option value="USD" ${db.settings.currency==='USD'?'selected':''}>USD — Dólar estadounidense</option></select></div></div><div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="saveSettings">Guardar configuración</button><button class="btn" id="importBtn">Importar respaldo JSON</button><input id="importFile" type="file" accept="application/json" class="hide"></div></div><p class="footer-note">El respaldo exportado contiene los datos almacenados localmente. Guárdalo en un lugar privado.</p>`;

  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());db={...structuredClone(emptyDB),...x};saveDB();alert('Respaldo importado.')}catch{alert('No se pudo importar ese archivo.')}};
 }

document.getElementById('view').addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();return}
 const n=e.target.closest('[data-new]');if(n){newRecord(n.dataset.new);return}
 const a=e.target.closest('[data-act]');if(a){if(a.dataset.act.startsWith('delete-')){if(confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')){const map={'delete-property':'properties','delete-apartment':'apartments'};db[map[a.dataset.act]]=db[map[a.dataset.act]].filter(x=>x.id!==a.dataset.id);saveDB()}}else if(a.dataset.act==='print-receipt')printReceipt(a.dataset.id);else if(a.dataset.act==='view-bill-photo'){const bill=db.bills.find(x=>x.id===a.dataset.id);if(bill?.photoData){const w=window.open('','_blank');if(w){w.document.write(`<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto de factura</title></head><body style="margin:0;background:#101216;display:grid;place-items:center;min-height:100vh"><img src="${bill.photoData}" alt="Foto de factura" style="max-width:100%;height:auto"></body></html>`);w.document.close()}else alert('Permite ventanas emergentes para ver la foto.')}}}
});
function newRecord(type){
 const bodyStart='<div class="form-grid">';let body='',save;
 if(type==='property'){
  body=bodyStart+field('Nombre de la propiedad','pName')+field('Dirección','pAddress')+`<div class="field full"><label>Método de distribución *</label><select id="pMethod"><option value="meters">Contador principal + subcontadores</option><option value="people">División por número de habitantes</option></select></div>`+'</div>';
  save=()=>{if(!val('pName'))return alert('Escribe el nombre de la propiedad.');db.properties.push({id:id(),name:val('pName'),address:val('pAddress'),method:val('pMethod')});closeModal();saveDB()};
 }else if(type==='apartment'){
  if(!db.properties.length)return alert('Primero crea una propiedad.');
  body=bodyStart+field('Propiedad','aProperty','select',propertyOptions())+field('Nombre o número','aName')+field('Responsable','aResponsible')+field('Número de habitantes','aPeople','number')+'</div>';
  save=()=>{if(!val('aProperty')||!val('aName'))return alert('Completa la propiedad y el nombre del apartamento.');db.apartments.push({id:id(),propertyId:val('aProperty'),name:val('aName'),responsible:val('aResponsible'),people:Math.max(0,Number(val('aPeople'))||0)});closeModal();saveDB()};
 }else if(type==='bill'){
  if(!db.properties.length)return alert('Primero crea una propiedad.');
  body=bodyStart+field('Propiedad','bProperty','select',propertyOptions())+`<div class="field"><label>Servicio *</label><select id="bService"><option>Enel</option><option>Acueducto</option><option>Vanti</option><option>Otro</option></select></div>`+field('Periodo de facturación','bPeriod')+field('Valor total','bAmount','number')+field('Fecha de emisión','bIssue','date', '',false)+field('Fecha de vencimiento','bDue','date','',false)+`<div class="field full"><label for="bPhoto">Foto de la factura (opcional)</label><input id="bPhoto" type="file" accept="image/*" capture="environment"><small class="muted">En iPhone puedes elegir “Tomar foto” para fotografiar la factura o seleccionar una imagen existente.</small><div id="bPhotoPreview" class="muted"></div></div><div class="field full"><label>Notas</label><textarea id="bNotes" placeholder="Datos de referencia, número de factura, etc."></textarea></div></div>`;
  save=async()=>{if(!val('bProperty')||!val('bAmount'))return alert('Selecciona propiedad e importe.');const file=document.getElementById('bPhoto')?.files?.[0];let photoData='';if(file){if(!file.type.startsWith('image/'))return alert('Selecciona una imagen.');try{photoData=await compressImage(file)}catch(e){return alert('No se pudo procesar la foto. Intenta con otra imagen.')}}db.bills.push({id:id(),propertyId:val('bProperty'),service:val('bService'),period:val('bPeriod'),amount:Number(val('bAmount')),issueDate:val('bIssue'),dueDate:val('bDue'),notes:val('bNotes'),photoData,photoName:file?.name||'',createdAt:new Date().toISOString()});closeModal();saveDB()};
 }else if(type==='reading'){
  if(!db.apartments.length)return alert('Primero crea un apartamento.');
  body=bodyStart+field('Apartamento','rApartment','select',apartmentOptions())+`<div class="field"><label>Servicio *</label><select id="rService"><option>Enel</option><option>Acueducto</option><option>Vanti</option></select></div>`+field('Periodo','rPeriod')+field('Lectura anterior','rPrevious','number')+field('Lectura actual','rCurrent','number')+'</div>';
  save=()=>{if(!val('rApartment')||val('rPrevious')===''||val('rCurrent')==='')return alert('Completa los campos de lectura.');if(Number(val('rCurrent'))<Number(val('rPrevious')))return alert('La lectura actual no puede ser menor que la anterior.');db.readings.push({id:id(),apartmentId:val('rApartment'),service:val('rService'),period:val('rPeriod'),previous:Number(val('rPrevious')),current:Number(val('rCurrent'))});closeModal();saveDB()};
 }else if(type==='payment'){
  if(!db.apartments.length)return alert('Primero crea un apartamento.');
  body=bodyStart+field('Apartamento','payApartment','select',apartmentOptions())+field('Concepto','payConcept')+field('Valor recibido','payAmount','number')+field('Fecha','payDate','date','',false)+`<div class="field"><label>Método</label><select id="payMethod"><option>Transferencia</option><option>Efectivo</option><option>Otro</option></select></div>`+field('Referencia','payRef','text','',false)+'</div>';
  save=()=>{if(!val('payApartment')||!val('payAmount'))return alert('Completa apartamento e importe.');db.payments.push({id:id(),apartmentId:val('payApartment'),concept:val('payConcept'),amount:Number(val('payAmount')),date:val('payDate')||new Date().toISOString().slice(0,10),method:val('payMethod'),reference:val('payRef')});closeModal();saveDB()};
 }else if(type==='receipt'){
  if(!db.apartments.length)return alert('Primero crea un apartamento.');
  body=bodyStart+field('Apartamento','recApartment','select',apartmentOptions())+field('Periodo','recPeriod')+field('Concepto','recConcept')+field('Valor total','recAmount','number')+'</div>';
  save=()=>{if(!val('recApartment')||!val('recAmount'))return alert('Completa apartamento e importe.');db.receipts.push({id:id(),number:'BR-'+new Date().getFullYear()+'-'+String(db.receipts.length+1).padStart(4,'0'),apartmentId:val('recApartment'),period:val('recPeriod'),concept:val('recConcept'),amount:Number(val('recAmount')),status:'Borrador',createdAt:new Date().toISOString()});closeModal();saveDB()};
 }
 const titles2={property:'Nueva propiedad',apartment:'Nuevo apartamento',bill:'Registrar factura',reading:'Registrar lectura',payment:'Registrar pago',receipt:'Crear recibo'};
 openModal(titles2[type]||'Nuevo registro',body,save);
 if(type==='bill'){
   const photoInput=document.getElementById('bPhoto');
   photoInput?.addEventListener('change',()=>{
     const file=photoInput.files?.[0], preview=document.getElementById('bPhotoPreview');
     if(!preview)return;
     if(!file){preview.textContent='';return;}
     preview.textContent='Foto seleccionada: '+file.name;
   });
 }
}
function compressImage(file){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onerror=reject;
   reader.onload=()=>{
     const img=new Image();
     img.onerror=reject;
     img.onload=()=>{
       const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height));
       const canvas=document.createElement('canvas');
       canvas.width=Math.max(1,Math.round(img.width*scale));
       canvas.height=Math.max(1,Math.round(img.height*scale));
       const ctx=canvas.getContext('2d');
       ctx.drawImage(img,0,0,canvas.width,canvas.height);
       resolve(canvas.toDataURL('image/jpeg',0.58));
     };
     img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}
function printReceipt(rid){const r=db.receipts.find(x=>x.id===rid);if(!r)return;const a=db.apartments.find(x=>x.id===r.apartmentId)||{};const p=db.properties.find(x=>x.id===a.propertyId)||{};const w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir el recibo.');w.document.write(`<html lang="es"><head><meta charset="utf-8"><title>${esc(r.number)}</title><style>body{font:16px Arial;padding:35px;color:#222}header{border-bottom:3px solid #c8a96a;padding-bottom:15px}h1{letter-spacing:4px;margin:0}small{letter-spacing:2px}section{margin-top:25px}table{width:100%;border-collapse:collapse;margin-top:20px}td{padding:12px;border-bottom:1px solid #ddd}.total{font-size:24px;font-weight:bold;text-align:right;margin-top:30px}.note{color:#666;font-size:12px;margin-top:40px}</style></head><body><header><h1>BERNAL</h1><small>ADMINISTRACIÓN RESIDENCIAL</small></header><section><h2>Recibo ${esc(r.number)}</h2><p><b>Propiedad:</b> ${esc(p.name||'—')}<br><b>Apartamento:</b> ${esc(a.name||'—')}<br><b>Responsable:</b> ${esc(a.responsible||'—')}<br><b>Periodo:</b> ${esc(r.period||'—')}</p><table><tr><td>${esc(r.concept||'Servicios públicos')}</td><td style="text-align:right">${money(r.amount)}</td></tr></table><div class="total">Total: ${money(r.amount)}</div><p class="note">Documento generado por BERNAL. Verifique los valores antes de realizar el pago.</p></section><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
render();
</script>
